kind = "web"
previewPath = "/"
title = "THUMBLAB"
version = "1.0.0"
id = "artifacts/thumblab"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24945

[services.development]
run = "pnpm --filter @workspace/thumblab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/thumblab", "run", "build" ]
publicDir = "artifacts/thumblab/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24945"
BASE_PATH = "/"
